<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Fixture A - estrategia 1 (.counter-value.last)</title></head>
<body>
<!-- Uma posicao por digito: os valores antigos ficam em .counter-value e o digito atual em .counter-value.last.
     Numero atual: 460600 -->
<yta-smooth-counter>
  <div><div class="counter-value">3</div><div class="counter-value last">4</div></div>
  <div><div class="counter-value">5</div><div class="counter-value last">6</div></div>
  <div><div class="counter-value">9</div><div class="counter-value last">0</div></div>
  <div><div class="counter-value">5</div><div class="counter-value last">6</div></div>
  <div><div class="counter-value">8</div><div class="counter-value last">0</div></div>
  <div><div class="counter-value">7</div><div class="counter-value last">0</div></div>
</yta-smooth-counter>
</body>
</html>
