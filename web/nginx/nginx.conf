# LiveStats - Nginx principal (T7).
#
# Executa como usuario 101 (imagem nginx-unprivileged) com rootfs somente leitura: tudo o que o Nginx
# escreve fica em tmpfs (/tmp para o pid; /var/cache/nginx para os temporarios; /etc/nginx/conf.d para a
# configuracao renderizada pelo envsubst na subida). Logs vao para stdout/stderr (driver json-file do Docker).
#
# Os dois `server` (8080 publica e 8081 admin) estao em templates/default.conf.template; os blocos comuns
# estao em snippets/. Ver docs/ARCHITECTURE.md secoes 6 e 7.

worker_processes  2;

error_log  /dev/stderr warn;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Nao revelar a versao do Nginx.
    server_tokens off;

    # Log sem cabecalhos de requisicao (nada de Cookie/Authorization). $remote_addr ja e o IP real quando
    # o proxy e confiavel (set_real_ip_from).
    log_format  livestats  '$remote_addr "$request" $status $body_bytes_sent $request_time';
    access_log  /dev/stdout  livestats;

    client_body_temp_path  /var/cache/nginx/client_temp;
    proxy_temp_path        /var/cache/nginx/proxy_temp;
    fastcgi_temp_path      /var/cache/nginx/fastcgi_temp;
    uwsgi_temp_path        /var/cache/nginx/uwsgi_temp;
    scgi_temp_path         /var/cache/nginx/scgi_temp;

    sendfile            on;
    keepalive_timeout   30s;

    # Corpo maximo de requisicao: o maior corpo legitimo e o dos cookies (256 KiB, D13).
    client_max_body_size      256k;
    client_body_buffer_size   64k;
    client_header_timeout     10s;
    client_body_timeout       10s;
    send_timeout              15s;

    autoindex  off;

    # DNS interno do Docker: a api e resolvida a cada requisicao (TTL curto), assim recriar o container da
    # api (novo IP) nao exige reiniciar o web.
    resolver          127.0.0.11 valid=10s ipv6=off;
    resolver_timeout  3s;

    # --- limites (ARCHITECTURE sec. 6). A chave e o IP real ($binary_remote_addr apos o modulo realip).
    # login: 10r/m com burst=5 nodelay deixa passar 6 requisicoes seguidas, para o contador da api
    # (5 falhas/60 s => 6a tentativa = 429) ser alcancavel; da 7a em diante o 429 e do Nginx.
    limit_req_zone  $binary_remote_addr  zone=login:2m    rate=10r/m;
    limit_req_zone  $binary_remote_addr  zone=admin:2m    rate=10r/s;
    limit_req_zone  $binary_remote_addr  zone=public:10m  rate=10r/s;
    limit_req_status     429;
    limit_req_log_level  warn;

    # Retry-After do 429: o login recupera 1 ficha a cada 6 s; o resto, a cada 1 s.
    map $uri $livestats_retry_after {
        default                       1;
        ~^/api/admin/login/*$         6;
    }

    include /etc/nginx/conf.d/*.conf;
}
