# Cabecalhos de seguranca de TODAS as respostas (ARCHITECTURE sec. 7), sempre com `always` para valerem
# tambem em 4xx/5xx e no 429. ATENCAO: add_header NAO e herdado quando o nivel atual declara qualquer
# add_header proprio; por isso todo bloco que declare um add_header inclui este arquivo (ou o equivalente
# dos overlays, security_headers_overlay.conf).
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), fullscreen=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
