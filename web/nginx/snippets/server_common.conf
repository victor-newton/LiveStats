# Parte comum aos dois `server` (8080 publica e 8081 admin).

root /usr/share/nginx/html;
autoindex off;

# Cabecalhos de seguranca em tudo o que nao declarar add_header proprio (e as locations que declaram
# incluem o snippet por conta propria).
include /etc/nginx/snippets/security_headers.conf;

# Erros gerados pelo Nginx respondem JSON (nunca a pagina HTML padrao), com os mesmos cabecalhos.
error_page 403 @e403;
error_page 404 @e404;
error_page 413 @e413;
error_page 429 @e429;
error_page 500 @e500;
error_page 502 @e502;
error_page 504 @e504;

location @e403 {
    default_type application/json;
    include /etc/nginx/snippets/error_headers.conf;
    return 403 '{"detail":"Forbidden"}';
}

location @e404 {
    default_type application/json;
    include /etc/nginx/snippets/error_headers.conf;
    return 404 '{"detail":"Not Found"}';
}

location @e413 {
    default_type application/json;
    include /etc/nginx/snippets/error_headers.conf;
    return 413 '{"detail":"Payload Too Large"}';
}

# limit_req_status 429: corpo JSON com Retry-After.
location @e429 {
    default_type application/json;
    include /etc/nginx/snippets/error_headers.conf;
    add_header Retry-After $livestats_retry_after always;
    return 429 '{"detail": "Muitas tentativas. Tente novamente em instantes."}';
}

location @e500 {
    default_type application/json;
    include /etc/nginx/snippets/error_headers.conf;
    return 500 '{"detail":"Internal Server Error"}';
}

location @e502 {
    default_type application/json;
    include /etc/nginx/snippets/error_headers.conf;
    return 502 '{"detail":"Bad Gateway"}';
}

location @e504 {
    default_type application/json;
    include /etc/nginx/snippets/error_headers.conf;
    return 504 '{"detail":"Gateway Timeout"}';
}

# Versoes com CORS, usadas SOMENTE pelas locations de dados publicos (um 429/502/504 gerado pelo Nginx
# nessas rotas precisa do CORS para o navegador conseguir ler o status).
location @cors_e429 {
    default_type application/json;
    include /etc/nginx/snippets/error_headers.conf;
    include /etc/nginx/snippets/cors_headers.conf;
    add_header Retry-After $livestats_retry_after always;
    return 429 '{"detail": "Muitas tentativas. Tente novamente em instantes."}';
}

location @cors_e502 {
    default_type application/json;
    include /etc/nginx/snippets/error_headers.conf;
    include /etc/nginx/snippets/cors_headers.conf;
    return 502 '{"detail":"Bad Gateway"}';
}

location @cors_e504 {
    default_type application/json;
    include /etc/nginx/snippets/error_headers.conf;
    include /etc/nginx/snippets/cors_headers.conf;
    return 504 '{"detail":"Gateway Timeout"}';
}
