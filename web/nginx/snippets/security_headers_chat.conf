# Mesmos cabecalhos de security_headers_overlay.conf (frame-ancestors * e sem X-Frame-Options, D11), exceto o img-src:
# so o overlay do chat (/overlay/chat.html, D57) carrega imagens dos CDNs dos emotes das plataformas.
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: https://static-cdn.jtvnw.net https://files.kick.com https://yt3.ggpht.com https://www.youtube.com; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors *" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), fullscreen=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
