# CORS aberto (D10), SOMENTE para os GET publicos de dados (/lives/{id}.json, /conjuntos/{id}.json, /inscritos.json, /api/public/*).
# Nunca enviar credenciais: a lista de cabecalhos e exatamente estes dois.
add_header Access-Control-Allow-Origin "*" always;
add_header Access-Control-Allow-Methods "GET" always;
