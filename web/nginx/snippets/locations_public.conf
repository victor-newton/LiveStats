# Rotas publicas: existem nas DUAS portas (8080 e 8081). Nada de admin aqui.
# (O mapa completo esta em docs/ARCHITECTURE.md sec. 6; qualquer rota fora deste arquivo e do bloco
# de admin da 8081 cai em `location / { return 404; }` do template.)

# --- saude (sem CORS)
location = /health {
    access_log off;
    limit_req zone=public burst=30 nodelay;
    default_type application/json;
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405 '{"detail":"Method Not Allowed"}';
    }
    include /etc/nginx/snippets/proxy_api.conf;
}

# --- dados publicos (CORS * + preflight 204)
# Sem a barra final o Nginx redirecionaria (301) para /api/public/; aqui e simplesmente 404.
location = /api/public {
    return 404;
}

location ^~ /api/public/ {
    include /etc/nginx/snippets/cors_data_body.conf;
}

location ~ ^/live[0-9]+\.json$ {
    include /etc/nginx/snippets/cors_data_body.conf;
}

location = /inscritos.json {
    include /etc/nginx/snippets/cors_data_body.conf;
}

# --- overlays (HTML/JS/CSS estaticos; frame-ancestors * e sem X-Frame-Options, D11)
location = /contador {
    limit_req zone=public burst=30 nodelay;
    default_type application/json;
    include /etc/nginx/snippets/static_headers_overlay.conf;
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405 '{"detail":"Method Not Allowed"}';
    }
    try_files /overlay/contador.html =404;
}

location ^~ /overlay/ {
    limit_req zone=public burst=30 nodelay;
    default_type application/json;
    include /etc/nginx/snippets/static_headers_overlay.conf;
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405 '{"detail":"Method Not Allowed"}';
    }
    if ($uri ~ /$) {
        return 404;
    }
    try_files $uri =404;
}
