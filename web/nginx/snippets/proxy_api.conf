# Encaminhamento para a api (rede interna). Usado por todas as locations que falam com a api.
#
# A api e resolvida por variavel + resolver (nginx.conf), sem URI: o caminho e a query seguem exatamente
# como chegaram.
#
# O Nginx escolhe a location pelo caminho NORMALIZADO ($uri), mas encaminha o caminho BRUTO. Para a api nunca
# receber um caminho diferente do que foi roteado, recusa-se (404) qualquer caminho bruto com segmento "." ou
# ".." ou com %2e, %2f, %5c, %00 codificados. Nenhuma rota legitima da aplicacao os usa.
if ($request_uri ~* "^[^?]*(%2e|%2f|%5c|%00|/\.\.?(/|$))") {
    return 404;
}

set $livestats_api "api:8000";
proxy_pass http://$livestats_api;

proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;

# IP real: $remote_addr ja vale o IP real quando a conexao vem do proxy confiavel (realip). Estes cabecalhos
# SOBRESCREVEM o que o cliente mandou; a api usa X-Real-IP para o contador de login por IP.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header CF-Connecting-IP "";
proxy_set_header Forwarded "";
proxy_set_header X-Forwarded-Host "";
proxy_set_header X-Forwarded-Proto "";
proxy_set_header Proxy "";

proxy_connect_timeout 3s;
proxy_send_timeout    15s;
proxy_read_timeout    30s;
proxy_redirect        off;
proxy_intercept_errors off;

# O Nginx e a unica fonte de cabecalhos de seguranca e de CORS: descarta qualquer um que a api envie
# (evita duplicidade e impede CORS vindo da api).
proxy_hide_header Access-Control-Allow-Origin;
proxy_hide_header Access-Control-Allow-Methods;
proxy_hide_header Access-Control-Allow-Headers;
proxy_hide_header Access-Control-Allow-Credentials;
proxy_hide_header Access-Control-Expose-Headers;
proxy_hide_header Access-Control-Max-Age;
proxy_hide_header Content-Security-Policy;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header Cross-Origin-Opener-Policy;
proxy_hide_header X-Powered-By;
