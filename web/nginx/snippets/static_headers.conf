# Painel (estaticos da 8081): cabecalhos de seguranca + `no-store, private`. O Cloudflare/NPM guarda .js/.css mesmo com
# `no-cache` na origem; com `no-store, private` nada do painel fica em cache compartilhado e um deploy novo vale ja.
# (Os overlays da 8080 seguem com `no-cache` e a versao em `?v=` na URL.)
include /etc/nginx/snippets/security_headers.conf;
add_header Cache-Control "no-store, private" always;
