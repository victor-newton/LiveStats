# Respostas de /api/admin/* (8081): cabecalhos de seguranca + `no-store, private`, sempre (ate nos erros da api).
# O Cache-Control da api e descartado: o Nginx e a unica fonte (evita duplicidade). Como esta location declara
# add_header proprio, os de seguranca sao incluidos aqui (add_header nao e herdado).
include /etc/nginx/snippets/security_headers.conf;
proxy_hide_header Cache-Control;
add_header Cache-Control "no-store, private" always;
