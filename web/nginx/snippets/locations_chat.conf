# Chat unificado (D57): SSE do worker-chat. So na 8080 (o painel nao tem previa ao vivo do chat; nao e incluido na 8081).
#
# O worker-chat e resolvido por variavel + resolver (nginx.conf), como a api: se ele estiver fora do ar o Nginx sobe do mesmo
# jeito e a rota responde 502 (JSON). Sem CORS: o overlay e da mesma origem. `$1` e copiado ANTES de qualquer `if`, que
# apagaria a captura.
location ~ "^/chat/([1-9][0-9]{0,9})/eventos$" {
    set $livestats_chat_set $1;
    limit_req zone=public burst=30 nodelay;
    limit_conn chat 4;                      # 4 conexoes SSE por IP real (o mesmo IP real dos limit_req)
    default_type application/json;
    include /etc/nginx/snippets/security_headers.conf;
    if ($request_method !~ ^(GET)$) {
        return 405 '{"detail":"Method Not Allowed"}';
    }

    set $livestats_chat "worker-chat:8090";
    proxy_pass http://$livestats_chat/eventos/$livestats_chat_set;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Proto "";
    proxy_set_header Proxy "";

    # Fluxo de eventos: nada de buffer nem cache; a conexao fica aberta (o worker manda `: ping` a cada 15 s).
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_connect_timeout 3s;
    proxy_send_timeout    15s;
    proxy_read_timeout    1h;
    proxy_redirect        off;
    proxy_intercept_errors off;

    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Expose-Headers;
    proxy_hide_header Access-Control-Max-Age;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Cross-Origin-Opener-Policy;
    proxy_hide_header X-Powered-By;
}
