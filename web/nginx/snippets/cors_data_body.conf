# Corpo das locations de GET publicos de DADOS (unicas com CORS, D10): /lives/{id}.json, /conjuntos/{id}.json,
# /inscritos.json e /api/public/*. Incluido de dentro de cada `location`.
limit_req zone=public burst=30 nodelay;
default_type application/json;

include /etc/nginx/snippets/security_headers.conf;
include /etc/nginx/snippets/cors_headers.conf;

# error_page nao e herdado quando a location declara algum: repete os do server e troca 429/502/504 pelos
# que carregam CORS.
error_page 400 @e400;
error_page 403 @e403;
error_page 404 @e404;
error_page 405 @e405;
error_page 413 @e413;
error_page 500 @e500;
error_page 429 @cors_e429;
error_page 502 @cors_e502;
error_page 504 @cors_e504;

# Preflight: respondido aqui, nao chega a api. Cabecalhos herdados da location (sem Allow-Credentials).
if ($request_method = OPTIONS) {
    return 204;
}
if ($request_method !~ ^(GET|HEAD)$) {
    return 405 '{"detail":"Method Not Allowed"}';
}

include /etc/nginx/snippets/proxy_api.conf;
