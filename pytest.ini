# Configuracao do pytest. Ninguem afrouxa a suite por aqui: sem --ignore, -k, -m "not ..."
# ou --deselect em addopts. Testes marcados como docker/e2e FALHAM sem o ambiente (nunca sao pulados).
[pytest]
pythonpath = . api
testpaths = tests
markers =
    docker: exige Docker em execucao; sem Docker o teste falha com mensagem clara
    e2e: exige a pilha completa do compose; sem ela o teste falha
    slow: teste lento (ex.: esperas reais de relogio)
xfail_strict = true
addopts = --strict-markers --strict-config -ra
