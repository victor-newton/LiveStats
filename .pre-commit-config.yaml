# Hooks locais antes de cada commit. Instalar uma vez: pre-commit install
# Versoes fixadas (rev). Os mesmos checks rodam no CI (.github/workflows/ci.yml).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key
      # Estes dois reescrevem arquivos: os golden files do contrato ficam de fora (bytes exatos).
      - id: end-of-file-fixer
        exclude: ^tests/contract/legacy/
      - id: trailing-whitespace
        exclude: ^tests/contract/legacy/

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff
